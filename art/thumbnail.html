<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cybersecurity — Filament plugin thumbnail</title>
  <style>
    :root {
      --red: #E11D48;
      --red-bright: #FB7185;
      --red-deep: #9F1239;
      --black: #050505;
      --panel: #111111;
      --border: #2A2A2A;
      --muted: #A3A3A3;
      --white: #FAFAFA;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      font-family: "Segoe UI", ui-sans-serif, system-ui, sans-serif;
      background: var(--black); color: var(--white);
    }
    .stage {
      width: 1920px; height: 1080px; padding: 64px 72px;
      display: grid; grid-template-columns: 0.95fr 1.15fr; gap: 48px; align-items: center;
      background:
        radial-gradient(800px 500px at 90% 10%, rgba(225, 29, 72, 0.32), transparent 55%),
        linear-gradient(140deg, #050505 0%, #14060A 100%);
    }
    .shield {
      width: 56px; height: 56px; border-radius: 14px; margin-bottom: 22px;
      background: linear-gradient(145deg, var(--red), var(--red-deep));
      display: grid; place-items: center;
      box-shadow: 0 10px 28px rgba(225, 29, 72, 0.4);
    }
    .shield svg { width: 30px; height: 30px; fill: #fff; }
    h1 { font-size: 56px; line-height: 1.08; font-weight: 800; margin-bottom: 16px; }
    h1 span { color: var(--red-bright); }
    p { font-size: 24px; color: var(--muted); max-width: 22ch; line-height: 1.4; margin-bottom: 28px; }
    .pills { display: flex; flex-wrap: wrap; gap: 10px; }
    .pill {
      background: rgba(225,29,72,.12); border: 1px solid rgba(251,113,133,.4);
      color: var(--red-bright); border-radius: 999px; padding: 10px 16px;
      font-size: 16px; font-weight: 700;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 24px;
      overflow: hidden; box-shadow: 0 28px 56px rgba(0,0,0,.5);
    }
    .bar { height: 7px; background: linear-gradient(90deg, var(--red-deep), var(--red), var(--red-bright)); }
    .inner { padding: 28px 30px 30px; }
    .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .title { font-size: 24px; font-weight: 800; }
    .grade { font-size: 42px; font-weight: 800; color: var(--red-bright); }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 18px; }
    .box {
      background: #0A0A0A; border: 1px solid var(--border); border-radius: 14px; padding: 16px;
    }
    .box .k { font-size: 13px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .box .v { font-size: 26px; font-weight: 800; margin-top: 4px; }
    .list { border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 16px; border-bottom: 1px solid var(--border); background: #0C0C0C;
      font-size: 18px; font-weight: 650;
    }
    .item:last-child { border-bottom: 0; }
    .ok { color: #4ADE80; font-size: 14px; font-weight: 800; }
    .bad { color: var(--red-bright); font-size: 14px; font-weight: 800; }
  </style>
</head>
<body>
  <div class="stage">
    <div>
      <div class="shield" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5.55 3.84 10.74 8 12 4.16-1.26 8-6.45 8-12V5l-8-3zm0 10.99h7c-.53 4.12-3.28 7.79-7 8.94V12H5V6.3l7-3.11v9.8z"/></svg>
      </div>
      <h1>Cybersecurity <span>Dashboard</span></h1>
      <p>Env · routes · Redis · workers · dependency risks — scored for Filament apps.</p>
      <div class="pills">
        <span class="pill">.env audit</span>
        <span class="pill">Protected routes</span>
        <span class="pill">Redis / queues</span>
        <span class="pill">CLI + CI</span>
      </div>
    </div>
    <div class="card">
      <div class="bar"></div>
      <div class="inner">
        <div class="head">
          <div class="title">Live findings</div>
          <div class="grade">B</div>
        </div>
        <div class="grid">
          <div class="box"><div class="k">Score</div><div class="v" style="color:#FB7185">86</div></div>
          <div class="box"><div class="k">Open issues</div><div class="v">3</div></div>
        </div>
        <div class="list">
          <div class="item"><span>APP_KEY present</span><span class="ok">PASS</span></div>
          <div class="item"><span>Session Secure + HttpOnly</span><span class="ok">PASS</span></div>
          <div class="item"><span>Dev packages in production</span><span class="bad">FAIL</span></div>
          <div class="item"><span>Queue not sync</span><span class="ok">PASS</span></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
